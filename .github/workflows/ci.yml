name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install Playwright browsers
        run: pnpm --filter @domainstack/web exec playwright install chromium --with-deps

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

      - name: Test packages
        run: pnpm exec turbo run test --filter='!@domainstack/web'

      - name: Test web app with coverage
        run: pnpm exec turbo run test:coverage --filter=@domainstack/web

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
