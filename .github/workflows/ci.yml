name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard fail (no continue-on-error): a stale catalog would ship raw
      # message-id hashes to users. If this fails, run the two commands
      # locally and commit the regenerated catalogs.
      - name: Check i18n catalogs are up to date
        run: |
          pnpm --filter @domainstack/i18n i18n:extract
          pnpm --filter @domainstack/i18n i18n:compile
          git diff --exit-code -- packages/i18n/src/locales

      - name: Install Playwright browsers
        run: pnpm --filter @domainstack/web exec playwright install chromium --with-deps

      - name: Run oxlint
        continue-on-error: true
        run: pnpm lint

      - name: Run typecheck
        continue-on-error: true
        run: pnpm check-types

      - name: Run tests with coverage report
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
