name: Screenshot runner image

on:
  push:
    branches: [main]
    paths:
      - "packages/screenshot-runner/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-screenshot-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/screenshot-runner/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-screenshot-runner.yml"
  workflow_dispatch:

# id-token: write is scoped to the publish job only, so a PR build never holds
# a credential it could exfiltrate.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/screenshot-runner/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    # workflow_dispatch ignores on.push.branches, so this has to check the ref
    # itself or a manual run on any branch would publish.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REFERENCE: vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/${{ vars.VERCEL_PROJECT_NAME }}/domainstack-screenshot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Vercel Container Registry
        uses: vercel/vcr-action/login@3affda703d82e1d40e4407ceb2c3c2b4238266a8 # v1.0.2
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/screenshot-runner/Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_REFERENCE }}:latest
            ${{ env.IMAGE_REFERENCE }}:${{ github.sha }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

      - name: Summarize
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Screenshot runner image published"
            echo
            echo 'Wait for the VCR repository to report `Ready`, then set this in Preview and Production:'
            echo
            echo '```'
            echo "SCREENSHOT_SANDBOX_IMAGE=${IMAGE_REFERENCE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
