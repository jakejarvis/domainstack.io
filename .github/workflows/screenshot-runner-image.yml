name: Screenshot runner image

on:
  push:
    branches: [main]
    paths:
      - "packages/screenshot-runner/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/screenshot-runner-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/screenshot-runner/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/screenshot-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: domainstack-screenshot

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only prove the image still builds. The apt font pin and
      # the build-time ad-blocking engine both fail loudly here rather than
      # after a merge.
      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/screenshot-runner/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exchanges the GitHub OIDC token for a short-lived Vercel token, so
      # there is no registry credential to store or rotate. Requires a VCR
      # OIDC policy on the Vercel team that matches this repository.
      - name: Log in to Vercel Container Registry
        if: github.event_name != 'pull_request'
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/screenshot-runner/Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/${{ vars.VERCEL_PROJECT_NAME }}/${{ env.IMAGE_REPOSITORY }}:latest
            vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/${{ vars.VERCEL_PROJECT_NAME }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          # zstd with OCI media types is what VCR recommends; image
          # decompression is on the Sandbox boot path for every capture.
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

      # SCREENSHOT_SANDBOX_IMAGE only accepts an immutable digest, so publishing
      # is deliberately not the same as rolling out. Promoting the digest stays
      # a human step.
      - name: Summarize
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Screenshot runner image published"
            echo
            echo 'Wait for the VCR repository to report `Ready`, then set this in Preview and Production:'
            echo
            echo '```'
            echo "SCREENSHOT_SANDBOX_IMAGE=${IMAGE_REPOSITORY}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
