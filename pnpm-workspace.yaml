packages:
  - apps/*
  - packages/*
catalog:
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/api-logs': ^0.222.0
  '@opentelemetry/exporter-logs-otlp-http': ^0.222.0
  '@opentelemetry/instrumentation': ^0.222.0
  '@opentelemetry/resources': ^2.11.0
  '@opentelemetry/sdk-logs': ^0.222.0
  '@opentelemetry/sdk-metrics': ^2.11.0
  '@opentelemetry/sdk-trace-base': ^2.11.0
  '@tabler/icons-react': ^3.48.0
  '@trpc/client': ^11.19.0
  '@trpc/server': ^11.19.0
  '@trpc/tanstack-react-query': ^11.19.0
  '@types/node': ^24.13.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/functions': ^3.9.9
  ipaddr.js: ^2.5.0
  msw: ^2.15.0
  rdapper: ^0.16.4
  sonner: ^2.0.8
  superjson: ^2.2.6
  vitest: ^5.0.2
  workflow: 5.0.0-beta.56
  zod: ^4.6.5
overrides:
  # iconv-lite 0.6.3 ships a .idea/ folder, which the Claude Code sandbox refuses to write.
  'iconv-lite@<0.7': ^0.7.3
confirmModulesPurge: false
publicHoistPattern:
  - '@sparticuz/chromium'
  - puppeteer-core
allowBuilds:
  '@posthog/cli': true
  '@swc/core': true
  bufferutil: true
  cbor-extract: true
  core-js: true
  esbuild: true
  msw: true
  puppeteer: true
  sharp: true
  '@nestjs/core': false
