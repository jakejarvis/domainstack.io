packages:
  - apps/*
  - packages/*
catalog:
  '@opentelemetry/api': ~1.9.1
  '@opentelemetry/api-logs': ^0.223.0
  '@opentelemetry/exporter-logs-otlp-http': ^0.223.0
  '@opentelemetry/instrumentation': ^0.223.0
  '@opentelemetry/resources': ^2.12.0
  '@opentelemetry/sdk-logs': ^0.223.0
  '@opentelemetry/sdk-metrics': ^2.12.0
  '@opentelemetry/sdk-trace-base': ^2.12.0
  '@tabler/icons-react': ^3.50.0
  '@trpc/client': ^11.19.0
  '@trpc/server': ^11.19.0
  '@trpc/tanstack-react-query': ^11.19.0
  '@types/node': ^24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/functions': ^3.10.4
  ipaddr.js: ^2.5.0
  msw: ^3.0.3
  rdapper: ^0.18.0
  sonner: ^2.0.8
  superjson: ^2.2.6
  vitest: ^5.0.5
  workflow: ^5.2.3
  zod: ^4.6.7
overrides:
  # iconv-lite 0.6.3 ships a .idea/ folder, which the Claude Code sandbox refuses to write.
  'iconv-lite@<0.7': ^0.7.3
  # Security patches for versions pinned by upstream packages (pnpm audit).
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'ip-address@>=10.0.0 <10.7.4': ^10.7.4
  'postcss-selector-parser@>=6.0.0 <6.1.5': ^6.1.5
  'qs@>=6.7.0 <6.16.1': ^6.16.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'zod@>=4.0.0 <4.6.6': ^4.6.7
confirmModulesPurge: false
allowBuilds:
  '@posthog/cli': true
  '@swc/core': true
  bufferutil: true
  cbor-extract: true
  core-js: true
  esbuild: true
  msw: true
  puppeteer: false
  sharp: true
  '@nestjs/core': false
minimumReleaseAgeExclude:
  - rdapper
