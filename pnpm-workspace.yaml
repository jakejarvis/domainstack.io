packages:
  - apps/*
  - packages/*
catalog:
  '@opentelemetry/api': ~1.9.1
  '@opentelemetry/api-logs': ^0.223.2
  '@opentelemetry/exporter-logs-otlp-http': ^0.223.2
  '@opentelemetry/instrumentation': ^0.223.2
  '@opentelemetry/resources': ^2.12.1
  '@opentelemetry/sdk-logs': ^0.223.2
  '@opentelemetry/sdk-metrics': ^2.12.1
  '@opentelemetry/sdk-trace-base': ^2.12.1
  '@tabler/icons-react': ^3.52.0
  '@trpc/client': ^11.29.7
  '@trpc/server': ^11.29.7
  '@trpc/tanstack-react-query': ^11.29.7
  '@types/node': ^26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/functions': ^3.11.3
  ipaddr.js: ^2.5.0
  msw: ^3.0.7
  rdapper: ^0.18.0
  sonner: ^2.0.8
  superjson: ^2.2.7
  vitest: ^5.1.1
  workflow: ^5.7.1
  zod: ^4.6.7
overrides:
  # iconv-lite 0.6.3 ships a .idea/ folder, which the Claude Code sandbox refuses to write.
  'iconv-lite@<0.7': ^0.7.3
allowBuilds:
  '@posthog/cli': true
  '@swc/core': true
  bufferutil: true
  cbor-extract: true
  core-js: true
  esbuild: true
  msw: true
  puppeteer: false
  sharp: true
  '@nestjs/core': false
minimumReleaseAgeExclude:
  - rdapper
